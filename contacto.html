  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }
    .back-container {
      max-width: 600px;
      margin: 0 auto 20px auto;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .back-btn:hover {
      background-color: #f8fafc;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .contact-container {
      background-color: #f8fafc;
      color: #0f172a;
      max-width: 600px;
      margin: 0 auto;
      padding: 50px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .contact-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .contact-subtitle {
      font-size: 1.1rem;
      margin-bottom: 32px;
      color: #475569;
      font-weight: 500;
    }
    .buttons-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      background-color: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
      transition: background-color 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
    }
    .btn:hover {
      background-color: #334155;
      transform: translateY(-2px);
    }
  </style>
</head>
